{% extends 'base.html' %}
{% block title %}Password reset — NexaMind{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;padding:40px 22px;">
  <div class="card" style="width:min(440px,100%);" data-animate>
    <div class="center">
      <h2 class="gold">Password updated</h2>
      <p class="muted">Your password has been reset successfully. Sign in with your new password.</p>
      <a class="btn btn-gold" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
