{% extends 'base.html' %}
{% block title %}Check your inbox — NexaMind{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;padding:40px 22px;">
  <div class="card" style="width:min(460px,100%);" data-animate>
    <div class="center">
      <div class="empty-ic" style="margin:0 auto 14px;">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>
      <h2 class="grad-text">Check your inbox</h2>
      <p class="muted">If an account exists for that address, a password reset link is on its way.</p>
      <a class="btn btn-gold" href="{% url 'accounts:login' %}">Return to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
