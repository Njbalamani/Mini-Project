{% extends 'base.html' %}
{% block title %}Delete task — NexaMind{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:40px auto;text-align:center;" data-animate>
  <div class="empty-ic" style="margin:0 auto 14px;color:#f87171;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
  </div>
  <h2>Delete this task?</h2>
  <p class="muted">“{{ task.title }}” and its activity history will be permanently removed.</p>
  <form method="post" class="flex gap-sm" style="justify-content:center;">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-ghost" href="{% url 'tasks:detail' task.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
